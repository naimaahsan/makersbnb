<html>
    <head>
        
        <title>Spaces</title>
        <link rel="stylesheet" href="/static/spaces.css">
    </head>

    <body>
        <h1>Spaces Available</h1>
        <main> 

            <form class="spaces-form" method="POST" action="/spaces">
                    <h3>Add a new space</h3>
                    <input type="text" name="name" placeholder="Name *" required>
                    <input type="text" name="description" placeholder="Description *" required>
                    <input type="text" name="address" placeholder="Address *" required>
                    <input type="text" name="price_per_night" placeholder="Price per night *" required>
                    <button type="submit" value="Submit">Submit</button>
                    <p>*Required</p>
            </form>
        </main>
    </body>
</html>
