<!DOCTYPE html>
<html>
    <head>
        <title>MakersBnB</title>
        <!--
            Head to https://github.com/makersacademy/web-applications-in-python/blob/main/pills/loading_css_or_static_files.md
            If you're wondering how the CSS file below is being loaded.
        -->
        <link rel="stylesheet" href="/static/style.css">
    </head>
    <body>
        <header>
            <nav>
            <a href="/signup">Sign Up</a>
            <a href="/login">Log In</a>
            <a href="/spaces">Create a Space</a>
            <a href="/">Available Spaces</a>
            </nav>
            <h1>{{ space.name }}</h1>
        </header>
       

                <p> Description: {{ space.description }} </p>  
                <p> Address: {{ space.address }} </p>  
                <p> Price: £{{ space.price_per_night }}</p>
                <p> Contact {{ space.user_email }} to make a booking for this space.</p>
                <form method="POST" action="/spaces/{{ space.id }}">
                    <h3>Book this space:</h3>
                    <input type="date" name="date" placeholder="Date *" required>
                    
                    <button type="submit" value="Submit">Submit</button>
                    <p>*Required</p>
            </form>
    </body>
</html>
